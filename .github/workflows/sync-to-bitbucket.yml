name: Sync main branch to Bitbucket

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history to allow push

      - name: Configure Git
        run: |
          git config user.name "GitHub Sync Bot"
          git config user.email "${{ secrets.BB_BOT_EMAIL }}"

      - name: Add Bitbucket remote and push main branch
        run: |
          git remote add bitbucket https://x-token-auth:${{ secrets.BB_TOKEN }}@bitbucket.org/${{ secrets.BB_REPO_PATH }}.git
          git push bitbucket main --force
